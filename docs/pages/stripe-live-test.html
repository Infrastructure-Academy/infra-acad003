<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iAAi — Secure Enrollment</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
body { font-family: 'Cormorant Garamond', Georgia, serif; background: #0A0F2A; color: #FFD700; margin: 0; padding: 2rem; }
.container { max-width: 480px; margin: 0 auto; background: #111835; border: 1px solid #C9A227; border-radius: 8px; padding: 2rem; }
h1 { text-align: center; font-size: 1.5rem; margin-bottom: 0.5rem; }
.subtitle { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 2rem; }
.form-group { margin-bottom: 1.2rem; }
label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #C9A227; }
input[type="text"], input[type="email"] {
  width: 100%; padding: 0.7rem; border: 1px solid #333; background: #0A0F2A; color: #FFD700;
  border-radius: 4px; font-size: 1rem; box-sizing: border-box;
}
input::placeholder { color: #666; }
#card-element { background: #0A0F2A; padding: 0.7rem; border: 1px solid #333; border-radius: 4px; }
#card-errors { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.4rem; min-height: 1.2rem; }
button {
  width: 100%; padding: 1rem; background: #C9A227; color: #0A0F2A; border: none;
  border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem;
}
button:hover { background: #FFD700; }
button:disabled { background: #555; color: #888; cursor: not-allowed; }
.secure-note { text-align: center; font-size: 0.75rem; color: #666; margin-top: 1rem; }
.logo { text-align: center; font-size: 2rem; margin-bottom: 0.5rem; }
</style>
    <link rel="stylesheet" href="/css/sitewide-image-fit.css">
  <script src="/js/sitewide-uix.js?v=20260905d" defer></script>
</head>
<body>
  <div class="container">
    <div class="logo">🏗️</div>
    <h1>Infrastructure Academy</h1>
    <p class="subtitle">Secure Enrollment — iAAi Practitioner Course</p>

    <form id="payment-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="As on card" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Card Details</label>
        <div id="card-element"></div>
        <div id="card-errors"></div>
      </div>

      <button type="submit" id="submit-button">
        Pay HKD $1.00 — Confirm Live
      </button>
    </form>

    <p class="secure-note">🔒 Encrypted by Stripe. iAAi never stores your card.</p>
  </div>

<script>
// LIVE STRIPE CONFIG — iAAi Infrastructure Academy
const stripe = Stripe('pk_live_51T90UtGu6aW29cXy4FfRiQ3JpMGj2fK0cKatLQRb2XfLLrK7LaJiOTstdTStnYFwZIQ2886IpWoSPZ2Z9dWyYJc000yErt2M6k');
const elements = stripe.elements();
const card = elements.create('card', { style: {
  base: {
    color: '#FFD700',
    fontFamily: '"Cormorant Garamond", Georgia, serif',
    fontSize: '16px',
    '::placeholder': { color: '#666' }
  },
  invalid: { color: '#ff6b6b' }
}});
card.mount('#card-element');

const form = document.getElementById('payment-form');
const submitBtn = document.getElementById('submit-button');
const errorDiv = document.getElementById('card-errors');

card.on('change', ({error}) => {
  errorDiv.textContent = error ? error.message : '';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Processing...';

  // Call your backend to create PaymentIntent
  // For now: demo mode — shows what the flow looks like
  // TODO: wire to backend /create-payment-intent endpoint

  const {token, error} = await stripe.createToken(card, {
    name: document.getElementById('name').value,
  });

  if (error) {
    errorDiv.textContent = error.message;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Pay HKD $1.00 — Confirm Live';
  } else {
    // Token received — in production, send to backend
    alert('Token created: ' + token.id.substring(0, 12) + '...\n\nIn production, this sends to your backend to charge HKD $1.00');
    submitBtn.textContent = '✅ Test Complete';
  }
});
</script>
</body>
</html>
