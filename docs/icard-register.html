<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCard Register (static) | Infrastructure Academy</title>
  <link rel="canonical" href="https://infrastructure-academy.com/icard-register.html">
  <meta name="description" content="Public iCard register — static load of the published gallery subset. No trpc. Not the full working-store count.">
  <style>
:root {
  --bg-primary: #0a1628;
  --bg-secondary: #0f1f3a;
  --bg-card: #111d35;
  --gold: #ffd700;
  --gold-dim: rgba(255,215,0,0.3);
  --text-primary: #ffffff;
  --text-secondary: #aaaaaa;
  --text-muted: #666666;
  --border: #1a3055;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); color: var(--text-primary); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; line-height: 1.5; }
a { color: var(--gold); }
.page-header { text-align: center; padding: 36px 20px 20px; border-bottom: 2px solid var(--gold); }
.page-header h1 { color: var(--gold); font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 6px; }
.page-header p { color: var(--text-secondary); font-size: 0.95rem; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px; }
.banner { background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.35); padding: 14px 16px; margin: 16px 0; font-size: 0.9rem; color: var(--text-secondary); }
.banner strong { color: var(--gold); }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; margin: 16px 0; }
.card h2 { color: var(--gold); font-size: 1.15rem; margin-bottom: 8px; }
.card .meta { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 10px; letter-spacing: 0.5px; }
.footer { text-align: center; padding: 28px 16px 40px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 32px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; align-items: center; }
.search-box { flex: 1; min-width: 200px; padding: 10px 14px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: inherit; }
.filter-btn { padding: 6px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 0.75rem; }
.filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.12); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
th { color: var(--gold); font-weight: normal; letter-spacing: 0.5px; }
.reg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.reg-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.reg-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--bg-secondary); }
.reg-card .info { padding: 10px 12px 12px; }
.reg-card .info h3 { color: var(--gold); font-size: 0.85rem; margin-bottom: 4px; }
.reg-card .info .meta { font-size: 0.7rem; color: var(--text-muted); }
.badge { display: inline-block; background: rgba(255,215,0,0.1); color: var(--gold); padding: 2px 8px; border-radius: 3px; font-size: 0.65rem; }

  #status { color: var(--text-muted); font-size: 0.8rem; margin: 8px 0 16px; }
  .placeholder-thumb { width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f1f3a,#0d1a30); color:var(--gold-dim); font-size:0.8rem; }
  </style>
</head>
<body>

<div id="iaai-network-bar" style="display:flex;align-items:center;justify-content:space-around;width:100%;height:36px;background:#0a1628;position:sticky;top:0;z-index:200001;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;">
  <a href="https://www.infrastructure-academy.com" style="text-decoration:none;color:#fff;font-weight:700;display:flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:3px solid #DC2626;">ACADEMY</a>
  <a href="https://realityeng-epdhlkrn.manus.space/" style="text-decoration:none;color:#fff;display:flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:3px solid transparent;">QUEST</a>
  <a href="/xchange/" style="text-decoration:none;color:#fff;display:flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:3px solid transparent;">XCHANGE</a>
  <a href="/memorial/" style="text-decoration:none;color:#fff;display:flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:3px solid transparent;">MEMORIAL</a>
  <a href="/news.html" style="text-decoration:none;color:#fff;display:flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:3px solid #06B6D4;">NEWS</a>
</div>

<header class="page-header">
  <h1>iCard Register</h1>
  <p>Static public subset — loads without trpc</p>
  <p class="count" id="headerCount" style="color:var(--gold);margin-top:8px;"></p>
</header>


<main class="wrap" style="max-width:1400px;">
  <div class="banner" id="honesty">
    <strong>Honesty.</strong> Loading register…
  </div>
  <div class="controls">
    <input class="search-box" id="q" type="search" placeholder="Search id, title, category, date…" autocomplete="off">
  </div>
  <div id="status"></div>
  <div class="reg-grid" id="grid"></div>
</main>
<footer class="footer">
  <p>Public iCard register — Actionable pack t1162u. Published gallery subset only. Not 2,192 working-store records.</p>
  <p style="margin-top:8px;"><a href="/icard-gallery.html">iCard Gallery</a> · <a href="library-landing.html">The Library</a> · <a href="news.html">News</a></p>
</footer>
<script>
(function () {
  const JSON_PATH = 'data/icard-register.json';
  let cards = [];
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const honesty = document.getElementById('honesty');
  const q = document.getElementById('q');
  const headerCount = document.getElementById('headerCount');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const term = (q.value || '').trim().toLowerCase();
    const filtered = cards.filter(function (c) {
      if (!term) return true;
      const blob = [c.id, c.title, c.category, c.date].join(' ').toLowerCase();
      return blob.indexOf(term) !== -1;
    });
    status.textContent = filtered.length + ' of ' + cards.length + ' cards shown';
    grid.innerHTML = filtered.map(function (c) {
      var media;
      if (c.is_page) {
        media = '<div class="placeholder-thumb">Page link</div>';
      } else if (c.image_url) {
        media = '<img src="' + esc(c.image_url) + '" alt="' + esc(c.title) + '" loading="lazy">';
      } else {
        media = '<div class="placeholder-thumb">No image</div>';
      }
      var residual = c.url_residual_session ? ' <span class="badge">residual session URL</span>' : '';
      var href = c.is_page ? c.page_url : (c.image_url || '#');
      return '<a class="reg-card" href="' + esc(href) + '" style="text-decoration:none;color:inherit;"' +
        (c.is_page || (c.image_url && c.image_url.indexOf('http') === 0) ? ' target="_blank" rel="noopener"' : '') + '>' +
        media + '<div class="info"><div class="meta">' + esc(c.id) + residual + '</div><h3>' + esc(c.title) +
        '</h3><div class="meta">' + esc(c.date) + ' · ' + esc(c.category) + '</div></div></a>';
    }).join('');
  }

  q.addEventListener('input', render);

  fetch(JSON_PATH)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      cards = data.cards || [];
      honesty.innerHTML = '<strong>Honesty.</strong> ' + esc(data.honesty_banner || '');
      headerCount.textContent = (data.card_count || cards.length) + ' published gallery cards (static)';
      render();
    })
    .catch(function (err) {
      honesty.innerHTML = '<strong>Failed to load register.</strong> Expected static JSON at ' + esc(JSON_PATH) +
        '. The old trpc endpoint is not used. ' + esc(err.message);
      status.textContent = 'Load failed';
    });
})();
</script>
</body>
</html>
